    <script>
      // 主题防闪烁：首屏渲染前根据 localStorage / 系统偏好设置初始主题
      ;(function () {
        try {
          var saved = localStorage.getItem('home-theme')
          var theme = saved
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
